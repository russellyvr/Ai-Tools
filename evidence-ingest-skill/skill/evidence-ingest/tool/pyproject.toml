[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-ingest"
version = "1.0.0"
description = "Closed-corpus document ingestion pipeline (folder in, RAG-ready folder out) with legal-grade chain of custody. Deterministic, fail-closed, LLM-free evidentiary path."
authors = [{name = "SwarmKey", email = "noreply@swarmkey.ai"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5,<3"]

[project.scripts]
evidence-ingest = "evidence_ingest.cli:main"

[tool.setuptools.packages.find]
include = ["evidence_ingest*"]
